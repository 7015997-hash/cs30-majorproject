<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch</title>
    <link rel="stylesheet" type="text/css" href="style.css">

<body>

    <section class="banner">
        <header>
            <a href="#" class="Ascii">Ascii</a>
            <div class="toggle" onClick="toggle();"></div>
        </header>

        
        <div class="content">
            <div class="contentBox"> 
                <h2>An Arcade for you</h2>
                <h1 data-texts="Arcade" class="title">Arcade</h1>
                <p>Click on the STARS to see the Instuctions...
                    Click on ICONS to Play...
                </p>
                <div class="imgBox">
                    <img src="./arcadebg.png" alt=""/>
                </div>
            </div> 
        </div>

        <!-- Navigation Icons -->
        <ul class="sci">
            <li><a href="#" onClick="changeState('front');toggle();"><ion-icon name="home-outline"></ion-icon></a></li>
            <li><a href="#" onClick="startGame();toggle();"><ion-icon name="color-palette-outline"></ion-icon></a></li>
            <li><a href="#" onClick="startOptions();toggle();"><ion-icon name="videocam-outline"></ion-icon></a></li>
            <li><a href="#" onClick="changeState('front');toggle();"><ion-icon name="logo-octocat"></ion-icon></a></li>
        </ul>

        <!-- Main Arcade Navigation Menu -->
        <ul class="menu">
            <li><a href="#" onClick="changeState('front');toggle();"><ion-icon name="home-outline"></ion-icon></a></li>
            <!-- <li><a href="#" >Letter Fidget</a></li>
            <li><a href="#" >Ascii cam</a></li>
            <li><a href="#" >Petcat</a></li> -->
        </ul>
    </section>

    <!-- Ionicons Pack Scripts -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="sketch.js"></script>

</body>
</html>
